apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment
  labels: 
    app: flask

spec: 
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      imagePullSecrets:
      - name: ecr-registry
      containers:
      - name: flask-container
        image: 832490156181.dkr.ecr.us-east-1.amazonaws.com/flask-cicd-repo:3a52f58883f4675088011c66199de5147e34dcd4
        ports:
          - containerPort: 5000
                  