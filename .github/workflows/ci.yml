name: Flask CI Pipeline

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main      
            
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: set up python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                
            - name: install dependencies
              run: |
                pip install -r requirements.txt
                
            - name: Build docker image
              run: |
                docker build -t flask-cicd:${{ github.sha }} . 
                
            - name: run container
              run: |
                docker run -d -p 5000:5000 \
                 --name flask-cicd-container \
                  flask-cicd:${{ github.sha }}    

            - name: check the health
              run: |
                sleep 5
                curl --fail http://localhost:5000/healthcheck      

            - name: Cleanup container
              if: always()
              run: |
               docker stop flask-cicd-container || true
               docker rm flask-cicd-container || true

            - name: Configure AWS credentials
              if: github.event_name == 'push'
              uses: aws-actions/configure-aws-credentials@v4  
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} 
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              if: github.event_name == 'push'
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2    

            - name: Tag docker image for ECR
              if: github.event_name == 'push'
              run: |
                docker tag flask-cicd:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/flask-cicd-repo:${{ github.sha }} 
            
            - name: Push Docker image to ECR
              if: github.event_name == 'push'
              run: |
                docker push ${{ steps.login-ecr.outputs.registry }}/flask-cicd-repo:${{ github.sha }}    